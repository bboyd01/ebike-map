# Coolify "Docker Compose" resource (docs/SPEC.md §11). Base directory `/`, compose file
# `/docker-compose.yml` (Coolify's defaults). Coolify runs compose with the repo root as the
# project directory, so every path here is relative to the repo root.
# Only `web` gets a domain in Coolify; brouter, data and auth stay on the internal network.
services:
  brouter:
    build: ./routing
    restart: unless-stopped
    volumes:
      - segments:/segments4
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:17777/brouter?lonlats=-87.6298,41.8781|-87.6244,41.8827&profile=ebike&format=geojson' >/dev/null"]
      interval: 60s
      timeout: 10s
      start_period: 300s

  # Password login (SPEC §20). Set AUTH_PASSWORD_HASH in Coolify's environment variables
  # (generate it with auth/hash-password.mjs; see the README). Until it's set, the app is locked.
  auth:
    build: ./auth
    restart: unless-stopped
    environment:
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:-}
      - SESSION_DAYS=${SESSION_DAYS:-180}
    volumes:
      - auth:/data
    mem_limit: 64m

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - brouter
      - auth
    volumes:
      - data:/srv/data:ro
    expose:
      - "80"
    mem_limit: 64m

  data:
    build: ./data
    restart: unless-stopped
    volumes:
      - segments:/segments4
      - data:/srv/data
    mem_limit: 512m

volumes:
  segments:
  data:
  auth:
